name: Deploy preview to GitHub Pages (QA)

# Ambiente temporário de QA para a branch edsoninovasix.
# NÃO substitui o deploy oficial da VPS (deploy.yml).
# O projeto Next.js fica em buildjerf-portfolio-master/buildjerf-portfolio-master.
# Publica o static export (pasta out) sob o subcaminho /Inovasix_pagina
# no repositório InovaSix/Inovasix_pagina, via GitHub Pages Actions oficiais.

on:
  push:
    branches: [edsoninovasix]
  workflow_dispatch:

# Permissões exigidas pelo GitHub Pages via Actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que apenas um deploy do Pages rode por vez.
concurrency:
  group: pages-preview
  cancel-in-progress: true

env:
  PROJECT_DIR: buildjerf-portfolio-master/buildjerf-portfolio-master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ env.PROJECT_DIR }}/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm ci

      - name: Build (GitHub Pages)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: /Inovasix_pagina
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_KEY }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: buildjerf-portfolio-master/buildjerf-portfolio-master/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
